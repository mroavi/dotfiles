# keyd configuration
#
# Symlinked to /etc/keyd/default.conf by bootstrap/arch/sudo-bootstrap.
# After editing:
#   > sudo keyd check    # validate syntax
#   > sudo keyd reload   # apply without restarting the daemon
#
# Docs: https://github.com/rvaiya/keyd

# Apply to all keyboards
[ids]

*

[main]

# Hold left alt to reach the nav layer (right alt stays AltGr for altgr-intl)
leftalt = layer(nav)

# ':A' makes this layer still behave as alt for every key not listed below,
# so existing alt shortcuts keep working
[nav:A]

h = left
j = down
k = up
l = right
